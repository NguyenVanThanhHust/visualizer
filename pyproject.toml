[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "visualizer"
version = "0.1.0"
description = "Simple 3D visualizer from scratch"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["pygame>=2.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/visualizer"]

[dependency-groups]
dev = ["pytest"]
